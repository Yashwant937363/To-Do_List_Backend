global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "todo-api-render"
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["to-do-list-backend-okq5.onrender.com"]
